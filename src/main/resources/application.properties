# Application
spring.application.name=ventastornillo

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_ventas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# El dialecto NO se especifica: Hibernate 6+ lo detecta automaticamente
# desde la conexion JDBC. Especificarlo genera un warning de deprecacion
# (HHH90000025) y puede fallar si la version del dialecto no coincide.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open Session in View deshabilitado (es el default recomendado en Spring Boot
# 3.x). Con OIV activo, la sesion de JPA permanece abierta durante todo el
# renderizado de la vista: mantiene conexiones al pool mas tiempo del
# necesario y oculta errores de lazy loading (LazyInitializationException)
# que solo aparecerian en produccion.
# Con OIV off, las relaciones LAZY deben cargarse dentro del @Transactional
# del Service, que es donde se mapean a DTO.
spring.jpa.open-in-view=false

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.show-actuator=false

# JWT
jwt.secret=${JWT_SECRET:EstaEsUnaClaveSecretaMuySeguraParaJWT2026Con32Caracteres!}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ==================== LOGS ESTRUCTURADOS ====================
# Spring Boot 3.4+ soporta logging estructurado nativo (formato ECS).
# El MDC (correlationId) se incluye automaticamente en cada evento.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=ventastornillo
logging.level.ferreteria.sistema.ventastornillo=INFO

# ==================== TIMEOUTS ====================
# Timeout de conexion: si el cliente no responde, se corta.
server.tomcat.connection-timeout=10s

# Limite de tamano de formularios POST (no es un timeout, es un limite de tamano).
server.tomcat.max-http-form-post-size=2MB

# Timeout de query a la base de datos (segundos).
spring.jpa.properties.jakarta.persistence.query.timeout=5

# Timeout de conexion y de query del pool HikariCP.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ==================== BULKHEAD ====================
# Limite de threads del servidor: evita que una carga sature toda la app.
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10

# Limite de conexiones al pool: acota el uso de la base de datos.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Timeout de espera para obtener una conexion del pool.
spring.datasource.hikari.leak-detection-threshold=60000

# ==================== RATE LIMITING ====================
app.rate-limit.login-attempts=5
app.rate-limit.login-window=1m
# Solo activar si la app esta detras de un proxy/load balancer de confianza
# que sobrescriba X-Forwarded-For. En false se usa la IP real del socket.
app.rate-limit.trust-forwarded-for=false
# Frecuencia de purga de los buckets inactivos (evita crecimiento de memoria).
app.rate-limit.cleanup-interval-ms=300000

# ==================== USUARIO ADMIN INICIAL ====================
# Credenciales del admin que crea el DataLoader en el primer arranque.
# Sin ADMIN_PASSWORD no se crea el usuario (fail-safe).
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# ==================== ACTUATOR / HEALTH ====================
# Endpoints expuestos. Solo health e info: info no revela datos sensibles.
management.endpoints.web.exposure.include=health,info
# "never" porque /actuator/health es publico (lo consume el health check
# de Docker). En local se puede cambiar a "always" para ver los detalles.
management.endpoint.health.show-details=never
# Habilita los probes de Kubernetes (/actuator/health/liveness y /readiness).
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.name=ventastornillo
info.app.version=@project.version@
info.app.description=API REST de ventas - Ferreteria Tornillo