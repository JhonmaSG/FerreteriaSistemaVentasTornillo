# Application
spring.application.name=ventastornillo

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_ventas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.show-actuator=false

# JWT
jwt.secret=${JWT_SECRET:EstaEsUnaClaveSecretaMuySeguraParaJWT2026Con32Caracteres!}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ==================== LOGS ESTRUCTURADOS ====================
# Spring Boot 3.4+ soporta logging estructurado nativo (formato ECS).
# El MDC (correlationId) se incluye automaticamente en cada evento.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=ventastornillo
logging.level.ferreteria.sistema.ventastornillo=INFO

# ==================== TIMEOUTS ====================
# Timeout de conexion: si el cliente no responde, se corta.
server.tomcat.connection-timeout=10s

# Limite de tamano de formularios POST (no es un timeout, es un limite de tamano).
server.tomcat.max-http-form-post-size=2MB

# Timeout de query a la base de datos (segundos).
spring.jpa.properties.jakarta.persistence.query.timeout=5

# Timeout de conexion y de query del pool HikariCP.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ==================== BULKHEAD ====================
# Limite de threads del servidor: evita que una carga sature toda la app.
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10

# Limite de conexiones al pool: acota el uso de la base de datos.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Timeout de espera para obtener una conexion del pool.
spring.datasource.hikari.leak-detection-threshold=60000

# ==================== RATE LIMITING ====================
app.rate-limit.login-attempts=5
app.rate-limit.login-window=1m
# Solo activar si la app esta detras de un proxy/load balancer de confianza
# que sobrescriba X-Forwarded-For. En false se usa la IP real del socket.
app.rate-limit.trust-forwarded-for=false
# Frecuencia de purga de los buckets inactivos (evita crecimiento de memoria).
app.rate-limit.cleanup-interval-ms=300000