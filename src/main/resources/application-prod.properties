# =====================================================================
# Perfil de produccion
# Activar con: SPRING_PROFILES_ACTIVE=prod
#
# Las diferencias respecto al perfil por defecto estan justificadas:
# en produccion se priorizan el rendimiento y la seguridad sobre la
# comodidad del desarrollo.
# =====================================================================

# No se imprimen las queries SQL: en produccion generates ruido enormouso
# y ralentiza la aplicacion. Para depurar, usar el perfil "dev".
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logback en modo estructurado (ECS) tambien en produccion: es lo que
# permite enviar los logs a un agregador (Loki, Elasticsearch, CloudWatch).
logging.structured.format.console=ecs
logging.structured.ecs.service.name=ventastornillo

# Nivel INFO: DEBUG genera demasiado volumen en produccion.
logging.level.ferreteria.sistema.ventastornillo=INFO
logging.level.org.hibernate.SQL=OFF

# El health check publico no debe revelar detalles de los componentes.
management.endpoint.health.show-details=never
